[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atman-lattice"
version = "0.9.0"
description = "Executable invariants for projective spacetime identity, authority enforcement, and coherence"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["model*"]
exclude = ["schemas*", "tests*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
