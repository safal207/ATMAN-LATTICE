[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atman-lattice"
version = "1.8.0"
description = "Executable invariants for identity, authority, transition geometry, durable verification, and adaptive evidence-bound verification-budget allocation"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["model*"]
exclude = ["schemas*", "tests*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
