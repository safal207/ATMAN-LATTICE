[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atman-lattice"
version = "1.13.0"
description = "Executable invariants for identity, authority, verification, active Bayesian learning, observer calibration, and governed model revision"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["model*"]
exclude = ["schemas*", "tests*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
